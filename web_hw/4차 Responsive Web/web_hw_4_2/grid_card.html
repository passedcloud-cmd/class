<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도서 구매 서비스</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .card-img-top {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }
    .card {
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="container my-5">
    <h1 class="text-center mb-5">도서 구매 서비스</h1>

    <div class="row g-4">

      <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <img src="book1.jpg" class="card-img-top" alt="도서 이미지 1">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">책 제목 1</h5>
            <p class="card-text">책 설명이 여기에 들어갑니다.</p>
            <button type="button" class="btn btn-primary mt-auto">구매하기</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <img src="book1.jpg" class="card-img-top" alt="도서 이미지 2">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">책 제목 2</h5>
            <p class="card-text">책 설명이 여기에 들어갑니다.</p>
            <button type="button" class="btn btn-primary mt-auto">구매하기</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <img src="book1.jpg" class="card-img-top" alt="도서 이미지 3">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">책 제목 3</h5>
            <p class="card-text">책 설명이 여기에 들어갑니다.</p>
            <button type="button" class="btn btn-primary mt-auto">구매하기</button>
          </div>
        </div>
      </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
