<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    h2 {
      color: darkviolet !important;
    }

    p {
      color: blue;
    }

    .orange {
      color: orange;
    }

    .green {
      color: green; 
      /* green이 orange보다 나중에 선언됨 그래서 green이 우위에 있음 */
    }

    #red {
      color: red;
    }
  </style>
</head>

<body>
  <p>1</p>
  <p class="orange">2</p>
  <p class="green orange">3</p>
  <p class="orange green">4</p>
  <!-- 3와 4 둘 다 green인 이유는 같은 클래스에서 green이 orange보다 나중에 정의되어서. -->
  <!-- 색을 2개 부여한 것. 순서는 중요하지 않음. 같은 클래스니까 나중에 정의된 게 우선  -->
  <p id="red" class="orange">5</p>
  <h2 id="red" class="orange">6</h2>
  <p id="red" class="orange" style="color: brown;">7</p>
  <h2 id="red" class="orange" style="color: brown;">8</h2>
</body>

</html>
